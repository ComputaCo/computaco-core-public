[package]
name = "cw-host-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Explicit adapters between a ComputerWorld world and the host: real HTTP, packages and files, each granted by the owner"
[features]
default = []
native-http = ["dep:reqwest"]

[dependencies]
cw-network = { version = "0.3.0", path = "../network" }
cw-protocol = { version = "0.3.1", path = "../../core/protocol" }
cw-modules = { version = "0.3.0", path = "../../core/modules" }
cw-service-node-app = { version = "0.3.0", path = "../../services/node-app" }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
