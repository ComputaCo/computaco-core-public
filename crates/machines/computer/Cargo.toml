[package]
name = "cw-computer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A simulated computer for ComputerWorld: filesystem, processes, a POSIX and a Windows shell, and its language runtimes"
[features]
default = ["python", "node", "sqlite"]
# The interpreters and sqlite3 the shell runs. Off, the command answers that this build
# has no such program (exit 127), as a machine without the package would.
python = ["dep:cw-pyvm"]
# Without `python`: run python3 in a module of its own (crates/bindings/py-module),
# fetched the first time a program runs, which asks the machine for everything it
# touches (cw_modules::script; docs/app-modules.md).
python-module = ["dep:cw-modules"]
node = ["dep:cw-jsvm"]
sqlite = ["dep:cw-sql"]
[dependencies]
cw-snapshot = { version = "0.3.0", path = "../../core/snapshot" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
regex = "1"
cw-protocol = { version = "0.3.1", path = "../../core/protocol" }
cw-packages = { version = "0.3.0", path = "../../core/packages" }
cw-sql = { version = "0.3.0", path = "../../engines/sql", optional = true }
cw-script-host = { version = "0.3.0", path = "../../languages/script-host" }
cw-pyvm = { version = "0.3.0", path = "../../languages/pyvm", optional = true }
cw-jsvm = { version = "0.3.0", path = "../../languages/jsvm", optional = true }
cw-zlib = { version = "0.3.0", path = "../../languages/zlib" }
cw-modules = { version = "0.3.0", path = "../../core/modules", optional = true }
[dev-dependencies]
proptest.workspace = true
