[package]
name = "cw-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ComputerWorld's deterministic CPU renderer: scenes to pixels, with the platforms' fonts, icons and wallpapers"
[features]
default = ["os-macos", "os-windows", "os-ubuntu", "os-ios", "os-android"]
# Each platform's wallpaper and icon set. A build without one renders no machine of it.
os-macos = []
os-windows = []
os-ubuntu = []
os-ios = []
os-android = []
# The thirteen web families (4.6 MB) are left out of the module and fetched on first
# use through `set_font_loader`, pinned by SHA-256 (src/font_pack.rs).
lazy-fonts = []
# What the renderer alone draws with (DejaVu, the drawn platforms' UI family, icons,
# wallpapers and symbol masks) is left out too and fetched by the first frame that needs
# it (src/render_pack.rs). A world driven through its scene never fetches any of it.
lazy-render = ["lazy-fonts"]
[dependencies]
cw-scene = { version = "0.3.0", path = "../scene" }
png = "0.17"
# `platform_independent` compiles out the SSSE3 / NEON / simd128 IDCT and
# colour-convert kernels, which are not bit-identical to the scalar ones; the
# renderer must produce the same pixels natively and under Wasm. It also drops
# the default `rayon` dependency, which is both non-deterministic and unbuildable
# for wasm32-unknown-unknown. Cargo features are additive, so nothing downstream
# can turn this back off.
jpeg-decoder = { version = "0.3", default-features = false, features = [
    "platform_independent",
] }
fontdue = "=0.9.3"
# Shapes colour emoji clusters with the colour font and walks its COLR paint graph
# (`rustybuzz::ttf_parser`); the same pinned version the scene crate lays out with.
rustybuzz = "=0.14.1"
serde.workspace = true
sha2.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
cw-protocol = { path = "../../core/protocol" }
serde_json.workspace = true
proptest.workspace = true
