[package]
name = "cw-app-module"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One application of computerworld as a Wasm module of its own, loaded by the engine on first launch"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
default = ["exports"]
# The module's exports (`exports!`). A crate that builds a module of its own applications
# leaves them out and writes its own.
exports = []
# Text is measured through the core: no metric tables or faces of the module's own.
core-text = ["cw-scene/core-text"]
[dependencies]
cw-applications = { path = "../../applications", default-features = false, features = ["module-guest"] }
cw-scene = { path = "../../graphics/scene" }
