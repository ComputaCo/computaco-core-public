[package]
name = "cw-app-module"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One application of computerworld as a Wasm module of its own, loaded by the engine on first launch"
[lib]
crate-type = ["cdylib", "rlib"]
[features]
# Exactly one per module build (scripts/build-wasm.sh with CW_WASM_LAZY=1): the module
# carries that application and nothing else of the desktop. Each measures text through
# the core (`core-text`): no metric tables or faces of its own.
kicad = ["cw-applications/kicad", "core-text"]
freecad = ["cw-applications/freecad", "core-text"]
office = ["cw-applications/office", "core-text"]
video = ["cw-applications/video", "core-text"]
music = ["cw-applications/music", "core-text"]
maps = ["cw-applications/maps", "core-text"]
code = ["cw-applications/code", "core-text"]
core-text = ["cw-scene/core-text"]
[dependencies]
cw-applications = { path = "../../applications", default-features = false, features = ["module-guest"] }
cw-scene = { path = "../../graphics/scene" }
