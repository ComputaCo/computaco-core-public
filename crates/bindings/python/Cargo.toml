[package]
name = "cw-python"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
name = "computerworld"
crate-type = ["cdylib"]
[features]
default = ["os-macos", "os-windows", "os-ubuntu", "os-ios", "os-android", "internet", "services", "python", "node", "sqlite", "freecad", "kicad", "office", "video", "music", "maps"]
# The built-in internet. Without it the wheel is smaller and boots only worlds that set
# `internet: false`.
internet = ["cw/internet"]
# What a smaller build may leave out (crates/computerworld/Cargo.toml says what each is).
services = ["cw/services"]
python = ["cw/python"]
node = ["cw/node"]
sqlite = ["cw/sqlite"]
os-macos = ["cw/os-macos"]
os-windows = ["cw/os-windows"]
os-ubuntu = ["cw/os-ubuntu"]
os-ios = ["cw/os-ios"]
os-android = ["cw/os-android"]
freecad = ["cw/freecad"]
kicad = ["cw/kicad"]
office = ["cw/office"]
video = ["cw/video"]
music = ["cw/music"]
maps = ["cw/maps"]
[dependencies]
cw = { package = "computerworld", path = "../../computerworld", default-features = false, features = ["render"] }
serde.workspace = true
serde_json.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
# The allocator (see `lib.rs`): the engine allocates small objects at a high rate.
mimalloc = { version = "0.1", default-features = false }
