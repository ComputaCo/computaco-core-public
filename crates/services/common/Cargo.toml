[package]
name = "cw-service-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "What ComputerWorld's synthetic internet services share: HTML, themes, accounts and validation"
[dependencies]
cw-protocol = { version = "0.3.0", path = "../../core/protocol" }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
cw-web = { version = "0.3.0", path = "../../web/engine", optional = true }
cw-internet = { version = "0.3.0", path = "../../internet", optional = true }

[features]
# `html::validate_strict`: runs a page through the engine strictly, and `reference`
# reads a site as the reference world has it. Meant for a service's tests: enable it
# from `[dev-dependencies]`, not from `[dependencies]`.
validate = ["dep:cw-web", "dep:cw-internet"]

[dev-dependencies]
cw-web = { path = "../../web/engine" }
