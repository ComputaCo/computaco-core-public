[package]
name = "cw-services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ComputerWorld's bundled service registry: the generic kinds, and kinds other crates add"
[dependencies]
cw-service-node-app = { version = "0.3.0", path = "./node-app" }
cw-protocol = { version = "0.3.0", path = "../core/protocol" }
cw-sdk = { version = "0.3.0", path = "../core/sdk" }
cw-service-static-site = { version = "0.3.0", path = "./static-site" }
cw-service-mail = { version = "0.3.0", path = "./mail" }
cw-service-chat = { version = "0.3.0", path = "./chat" }
cw-service-messages = { version = "0.3.0", path = "./messages" }
cw-service-docs = { version = "0.3.0", path = "./docs" }
cw-service-calendar = { version = "0.3.0", path = "./calendar" }
cw-service-assistant = { version = "0.3.0", path = "./assistant" }
cw-service-drive = { version = "0.3.0", path = "./drive" }
cw-service-forum = { version = "0.3.0", path = "./forum" }
cw-service-search = { version = "0.3.0", path = "./search" }
cw-service-wiki = { version = "0.3.0", path = "./wiki" }
cw-service-common = { version = "0.3.0", path = "./common", optional = true }
cw-web = { version = "0.3.0", path = "../web/engine", optional = true }
serde_json = { workspace = true, optional = true }
[features]
# What every kind owes (`checks`), for an extension's tests.
checks = ["dep:cw-service-common", "cw-service-common/validate", "dep:cw-web", "dep:serde_json"]
[dev-dependencies]
serde_json.workspace = true
cw-service-common = { path = "./common", features = ["validate"] }
cw-web = { path = "../web/engine" }
