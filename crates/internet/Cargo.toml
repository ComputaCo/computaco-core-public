[package]
name = "cw-internet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The built-in internet every world joins unless it opts out: public sites, backbone and public DNS"
repository.workspace = true
homepage.workspace = true
[features]
# The internet's world is not in the build: it is fetched from the module host the first
# time a world joins it (`data/internet.json`, pinned by SHA-256; docs/app-modules.md).
on-demand = ["dep:cw-modules"]

[dependencies]
cw-protocol = { version = "0.3.1", path = "../core/protocol" }
serde_json.workspace = true
cw-modules = { version = "0.3.0", path = "../core/modules", optional = true }

[build-dependencies]
sha2.workspace = true
